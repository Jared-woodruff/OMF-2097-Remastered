<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>One Must Fall 2097 Remastered</title>
    <link rel="icon" href="./favicon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="One Must Fall 2097 Remastered: the 1994 robot fighting classic, rebuilt in HD." />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      #screen { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      @font-face { font-family: 'OMF UI'; src: url('fonts/Orbitron.ttf') format('truetype'); font-weight: 400 900; font-display: swap; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              gap: 14px; text-align: center; pointer-events: none; font-family: 'OMF UI', 'Segoe UI', system-ui, sans-serif;
              background: radial-gradient(ellipse at 50% 45%, #0b1440 0%, #03050f 55%, #000 100%); color: #cfe0ff; }
      #boot .mark { font-weight: 900; font-size: clamp(22px, 4.2vw, 64px); letter-spacing: .12em;
                    background: linear-gradient(180deg, #fff 0%, #cdd8ff 40%, #5b77ff 50%, #1b2a86 53%, #9ab6ff 66%, #fff 100%);
                    -webkit-background-clip: text; background-clip: text; color: transparent;
                    filter: drop-shadow(0 0 18px rgba(60,110,255,.55)); }
      #boot .sub { font-weight: 800; font-size: clamp(11px, 1.4vw, 22px); letter-spacing: .55em; margin-right: -.55em; color: #bff6ff;
                   text-shadow: 0 0 8px #33e6ff, 0 0 22px #2f5bff; }
      #boot .bar { width: min(420px, 60vw); height: 4px; margin-top: 18px; border-radius: 4px; background: rgba(60,100,255,.18);
                   overflow: hidden; box-shadow: 0 0 12px rgba(60,100,255,.25); }
      #boot .fill { display: block; height: 100%; width: 0; border-radius: 4px; transition: width .25s;
                    background: linear-gradient(90deg, #2f5bff, #33e6ff); box-shadow: 0 0 12px #33e6ff; }
      #boot .text { min-height: 1.4em; font-weight: 600; font-size: clamp(11px, 1vw, 15px); letter-spacing: .18em; color: #8fa6e8; }
    </style>
  </head>
  <body>
    <canvas id="screen" tabindex="0"></canvas>
    <div id="boot"><div class="mark">ONE MUST FALL 2097</div><div class="sub">REMASTERED</div>
      <div class="bar"><i class="fill"></i></div><div class="text">LOADING…</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
