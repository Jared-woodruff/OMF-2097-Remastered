<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- OMF 2097 Remastered app icon (original design): a chrome mech head with a golden V-fin and a glowing visor on a
       steel hex badge. -->
  <defs>
    <linearGradient id="rim" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#c6ced9"/>
      <stop offset="0.5" stop-color="#6d7788"/>
      <stop offset="0.72" stop-color="#c3cbd6"/>
      <stop offset="1" stop-color="#3a414d"/>
    </linearGradient>
    <radialGradient id="plate" cx="0.5" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#34405a"/>
      <stop offset="0.55" stop-color="#151b28"/>
      <stop offset="1" stop-color="#06080d"/>
    </radialGradient>
    <radialGradient id="burst" cx="0.5" cy="0.58" r="0.42">
      <stop offset="0" stop-color="#ffa030" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#ff5a14" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff3a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#e3e8f0"/>
      <stop offset="0.47" stop-color="#9aa5b6"/>
      <stop offset="0.5" stop-color="#434b59"/>
      <stop offset="0.7" stop-color="#8f9aab"/>
      <stop offset="1" stop-color="#dfe5ee"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4455"/>
      <stop offset="1" stop-color="#0e1219"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d00"/>
      <stop offset="0.28" stop-color="#ffb21e"/>
      <stop offset="0.5" stop-color="#fff6c4"/>
      <stop offset="0.72" stop-color="#ffb21e"/>
      <stop offset="1" stop-color="#ff3d00"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3b8"/>
      <stop offset="0.35" stop-color="#ffc233"/>
      <stop offset="0.7" stop-color="#e07a10"/>
      <stop offset="1" stop-color="#8a3a06"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb4a0"/>
      <stop offset="0.45" stop-color="#ff2a1a"/>
      <stop offset="1" stop-color="#7a0606"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="16" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="inner">
      <polygon points="512,112 858,312 858,712 512,912 166,712 166,312"/>
    </clipPath>
    <clipPath id="head">
      <path id="headShape" d="M430 318 L594 318 L666 360 L702 436 L710 542 L690 622 L622 722 L562 790 L512 806 L462 790 L402 722 L334 622 L314 542 L322 436 L358 360 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <!-- Hex badge: chrome rim, dark steel plate, fire behind the head, orange inner line. -->
    <polygon points="512,40 921,276 921,748 512,984 103,748 103,276" fill="url(#rim)" stroke="url(#rim)" stroke-width="44" stroke-linejoin="round"/>
    <polygon points="512,92 876,302 876,722 512,932 148,722 148,302" fill="#0b0e15" stroke="#0b0e15" stroke-width="22" stroke-linejoin="round"/>
    <polygon points="512,112 858,312 858,712 512,912 166,712 166,312" fill="url(#plate)"/>
    <g clip-path="url(#inner)">
      <ellipse cx="512" cy="590" rx="430" ry="400" fill="url(#burst)"/>
      <g stroke="#ff8a2a" stroke-opacity="0.4" stroke-width="10" stroke-linecap="round">
        <line x1="182" y1="440" x2="292" y2="462"/>
        <line x1="166" y1="530" x2="290" y2="532"/>
        <line x1="188" y1="620" x2="296" y2="600"/>
        <line x1="842" y1="440" x2="732" y2="462"/>
        <line x1="858" y1="530" x2="734" y2="532"/>
        <line x1="836" y1="620" x2="728" y2="600"/>
      </g>
    </g>
    <polygon points="512,122 849,317 849,707 512,902 175,707 175,317" fill="none" stroke="#ff7a1a" stroke-opacity="0.8" stroke-width="7" stroke-linejoin="round"/>

    <!-- V-fin behind the forehead. -->
    <g stroke="#140a04" stroke-width="12" stroke-linejoin="round">
      <path d="M520 398 L278 188 L300 150 L352 176 L548 352 Z" fill="url(#gold)"/>
      <path d="M504 398 L746 188 L724 150 L672 176 L476 352 Z" fill="url(#gold)"/>
    </g>

    <!-- Head: chrome shell with darker side facets. -->
    <use href="#headShape" fill="url(#chrome)"/>
    <g clip-path="url(#head)">
      <polygon points="300,300 430,318 382,470 334,622 300,700" fill="#0b0e14" fill-opacity="0.38"/>
      <polygon points="724,300 594,318 642,470 690,622 724,700" fill="#0b0e14" fill-opacity="0.22"/>
      <polygon points="334,622 402,722 462,790 512,806 562,790 622,722 690,622 640,660 512,700 384,660" fill="#0b0e14" fill-opacity="0.18"/>
      <path d="M440 330 L584 330" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-opacity="0.95"/>
    </g>
    <use href="#headShape" fill="none" stroke="#0a0c11" stroke-width="16" stroke-linejoin="round"/>
    <!-- Crest gem. -->
    <path d="M512 346 L540 380 L512 420 L484 380 Z" fill="url(#gem)" stroke="#1a0404" stroke-width="10" stroke-linejoin="round" filter="url(#softglow)"/>

    <!-- Face plate, visor, mouth vents. -->
    <path d="M364 470 L660 470 L654 594 C646 640 616 690 574 726 L512 762 L450 726 C408 690 378 640 370 594 Z"
          fill="url(#face)" stroke="#07090d" stroke-width="12" stroke-linejoin="round"/>
    <path d="M384 506 L512 566 L640 506 L634 552 L512 618 L390 552 Z" fill="url(#visor)" filter="url(#glow)"/>
    <path d="M428 544 L512 584 L596 544" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#5f6a7c" stroke-width="9" stroke-linecap="round">
      <line x1="480" y1="664" x2="480" y2="706"/>
      <line x1="512" y1="668" x2="512" y2="718"/>
      <line x1="544" y1="664" x2="544" y2="706"/>
    </g>
    <!-- Cheek vents. -->
    <g stroke="#0a0c11" stroke-width="10" stroke-linecap="round">
      <line x1="336" y1="556" x2="356" y2="562"/>
      <line x1="340" y1="592" x2="362" y2="598"/>
      <line x1="688" y1="556" x2="668" y2="562"/>
      <line x1="684" y1="592" x2="662" y2="598"/>
    </g>
  </g>
</svg>
